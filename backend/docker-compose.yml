# Servicios para desarrollo local: Postgres y MinIO (bucket compatible con S3).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portafolio
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    # minio/minio desapareció de Docker Hub (sep 2026); fork oficial de Chainguard.
    image: cgr.dev/chainguard/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  minio-setup:
    image: amazon/aws-cli
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      /bin/sh -c "sleep 3 && aws --endpoint-url http://minio:9000 s3 mb s3://portafolio || true"

volumes:
  pgdata:
  miniodata:
